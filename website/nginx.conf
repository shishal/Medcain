server {
    listen 80;
    listen [::]:80;
    server_name medico.shishal.com localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare (and any TLS terminator) already has HTTPS.
    # Honour the original scheme if someone generates absolute URLs later.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Marketing pages stay strict. /checkout/index.html widens this so
    # Supabase Auth and Razorpay Checkout can load. Do not loosen it globally.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self' mailto:";

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $csp always;

    # Play Console sometimes uses these paths; keep one account/refunds page.
    rewrite ^/refunds/?$ /account/ permanent;
    rewrite ^/privacy$ /privacy/ permanent;
    rewrite ^/terms$ /terms/ permanent;
    rewrite ^/account$ /account/ permanent;
    rewrite ^/checkout$ /checkout/ permanent;

    # HTML must not be sticky in Cloudflare — deploys change ?v= on CSS/JS.
    # (Do not add_header here: nginx would drop the server-level security headers.)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;

    # Long-lived only because HTML references /css/site.css?v=… and /js/site.js?v=….
    # Bump that query string whenever you change those files, then rebuild the image.
    location ~* \.(css|js|png|svg|ico|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
    }

    # Checkout HTML only. Other pages keep the strict $csp above.
    # *.razorpay.com covers checkout.js, the modal frame, and risk-detection.
    location = /checkout/index.html {
        set $csp "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://*.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.razorpay.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: https://*.razorpay.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.razorpay.com; frame-src https://*.razorpay.com; worker-src 'self' blob:; base-uri 'self'; form-action 'self' https://*.razorpay.com mailto:";
    }

    # Written at container start. Never cache — it is host-specific.
    location = /checkout/config.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
