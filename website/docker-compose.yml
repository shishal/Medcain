name: medico

# Bind to loopback. Cloudflare Tunnel (or another reverse proxy) is the
# public door — do not change 127.0.0.1 to 0.0.0.0 unless you mean to.
services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    image: medico-site:local
    container_name: medico-site
    restart: unless-stopped
    # Public keys only. Compose fills ${SUPABASE_URL} from the .env in the
    # directory you run `docker compose` from (the repo root). env_file is
    # a fallback for `website/`, but a ../ path is dropped on some Windows
    # Compose builds, so do not rely on it alone.
    # Secret keys that share that .env are blanked so they never reach nginx.
    env_file:
      - path: ../.env
        required: false
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      DATABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      RAZORPAY_KEY_ID: ""
      RAZORPAY_KEY_SECRET: ""
      RAZORPAY_WEBHOOK_SECRET: ""
      CLOUDFLARE_TUNNEL_TOKEN: ""
    ports:
      - "127.0.0.1:${MEDICO_SITE_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - web

  # Optional sidecar. Create a Cloudflare Tunnel whose public hostname is
  # medico.shishal.com and whose origin is http://site:80 (this network).
  # Then: CLOUDFLARE_TUNNEL_TOKEN=... docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: medico-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      site:
        condition: service_healthy
    networks:
      - web

networks:
  web:
    driver: bridge
