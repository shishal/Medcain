# Regenerated from assets/branding/ via:
#   dart run flutter_native_splash:create
#
# Follows OS light/dark (not the in-app ThemeMode preference — native splash
# cannot read SharedPreferences). Light paper + dark-ink mark vs black + white
# mark. Flutter SplashScreen then matches the resolved app theme.
flutter_native_splash:
  color: "#F4F4F5"
  color_dark: "#000000"
  image: assets/branding/splash_logo_light.png
  image_dark: assets/branding/splash_logo.png
  android: true
  ios: true
  web: false
  android_12:
    # Android 12 masks this image to a circle. Use the circle-safe mark so
    # the M legs are not cropped. Pre-12 splash keeps the larger letter-fit.
    color: "#F4F4F5"
    color_dark: "#000000"
    image: assets/branding/splash_icon_light.png
    image_dark: assets/branding/splash_icon.png
    icon_background_color: "#F4F4F5"
    icon_background_color_dark: "#000000"
