# Regenerated from assets/branding/ via:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  # Padding is baked into the foreground (M sized for the circular mask).
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/branding/app_icon_monochrome.png
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
